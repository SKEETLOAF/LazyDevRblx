name: Node bridge tests

on:
  push:
    branches:
      - main
      - 'build/**'
  pull_request:

permissions:
  contents: read

jobs:
  node-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run dependency-free bridge tests
        run: npm test
